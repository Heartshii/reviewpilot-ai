name: CI

on:
  push:
    branches:
      - main
      - master
      - "codex/**"
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: pk_test_ci
      CLERK_SECRET_KEY: sk_test_ci
      NEXT_PUBLIC_CONVEX_URL: https://example.convex.cloud
      CONVEX_DEPLOYMENT: dev:ci
      TWILIO_ACCOUNT_SID: AC00000000000000000000000000000000
      TWILIO_AUTH_TOKEN: test-token
      OPENAI_API_KEY: sk-test-openai
      RESEND_API_KEY: re_test_ci
      REVIEWPILOT_ALERT_FROM_EMAIL: alerts@example.com
      STRIPE_SECRET_KEY: sk_test_ci
      STRIPE_WEBHOOK_SECRET: whsec_test_ci
      STRIPE_PRICE_STARTER: price_starter_ci
      STRIPE_PRICE_GROWTH: price_growth_ci
      STRIPE_PRICE_SCALE: price_scale_ci
      STRIPE_TRIAL_DAYS: "14"
      SUPER_ADMIN_EMAILS: admin@example.com
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      APP_URL: http://localhost:3000
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build
